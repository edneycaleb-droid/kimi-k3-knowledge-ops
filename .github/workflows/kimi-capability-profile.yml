name: Kimi Capability Profile

on:
  pull_request:
    paths:
      - "governance/kimi_capability_profile.json"
      - ".agents/skills/**"
      - "scripts/validate_kimi_capability_profile.py"
      - "tests/test_kimi_capability_profile.py"
      - ".github/workflows/kimi-capability-profile.yml"
  push:
    branches: [main]
    paths:
      - "governance/kimi_capability_profile.json"
      - ".agents/skills/**"
      - "scripts/validate_kimi_capability_profile.py"
      - "tests/test_kimi_capability_profile.py"
      - ".github/workflows/kimi-capability-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kimi-capability-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 scripts/validate_kimi_capability_profile.py
      - run: python3 -m unittest discover -s tests -p 'test_kimi_capability_profile.py' -v
